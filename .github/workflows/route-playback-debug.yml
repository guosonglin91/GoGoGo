name: Route Playback V1 Debug APK

on:
  push:
    branches: [route-playback-v1]
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install project Android SDK packages
        run: sdkmanager 'platforms;android-32' 'build-tools;36.0.0' 'ndk;26.2.11394342'

      - name: Configure map build properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPS_SAFE_CODE: ${{ secrets.MAPS_SAFE_CODE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          with open('local.properties', 'w', encoding='utf-8') as properties:
              for key in ('MAPS_API_KEY', 'MAPS_SAFE_CODE'):
                  properties.write(f'{key}={json.dumps(os.environ.get(key) or "UNCONFIGURED")}\n')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run GoGoGo Debug Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run RunnerProbe Debug Unit Tests
        run: ./gradlew :runnerprobe:testDebugUnitTest

      - name: Run V2-E Analyzer Unit Tests
        env:
          PYTHONPATH: motion-analysis
        run: python -m unittest discover -s motion-analysis/tests -p 'test_*.py' -v

      - name: Run V2-F BCT-1 Unit Tests
        run: python -m unittest discover -s bct1/tests -p 'test_*.py' -v

      - name: Assemble GoGoGo Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Assemble RunnerProbe Debug APK
        run: ./gradlew :runnerprobe:assembleDebug

      - name: Verify Debug APK Signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APP_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          PROBE_APK="$(find runnerprobe/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APP_APK"
          test -n "$PROBE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$APP_APK"
          "$APKSIGNER" verify --verbose --print-certs "$PROBE_APK"

      - name: Save GoGoGo Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: route-playback-v1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Save RunnerProbe Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: runnerprobe-v2e-debug-apk
          path: runnerprobe/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Save V2-E Analysis Toolkit
        uses: actions/upload-artifact@v4
        with:
          name: v2e-analysis-toolkit
          path: |
            motion-analysis/**/*.py
            docs/v2e/*.md
          if-no-files-found: error

      - name: Prepare V2-E Acceptance Bundle
        run: |
          set -euo pipefail
          ROOT="v2e-acceptance-bundle"
          mkdir -p "$ROOT/apks" "$ROOT/toolkit" "$ROOT/docs"

          APP_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          PROBE_APK="$(find runnerprobe/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APP_APK"
          test -n "$PROBE_APK"

          cp "$APP_APK" "$ROOT/apks/GoGoGo-debug.apk"
          cp "$PROBE_APK" "$ROOT/apks/RunnerProbe-debug.apk"
          cp -R motion-analysis "$ROOT/toolkit/motion-analysis"
          cp docs/v2e/acceptance-procedure.md "$ROOT/docs/"
          cp docs/v2e/implementation-status.md "$ROOT/docs/"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("v2e-acceptance-bundle")
          apk_dir = root / "apks"

          files = []
          for path in sorted(apk_dir.glob("*.apk")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({
                  "name": path.name,
                  "bytes": path.stat().st_size,
                  "sha256": digest,
              })

          provenance = {
              "schema_version": "v2e-1",
              "source_commit_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "ref_name": os.environ.get("GITHUB_REF_NAME", ""),
              "apks": files,
              "physical_gate_acceptance": "PENDING",
          }

          (root / "BUILD_PROVENANCE.json").write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with (root / "SHA256SUMS.txt").open("w", encoding="utf-8") as handle:
              for item in files:
                  handle.write(f'{item["sha256"]}  apks/{item["name"]}\n')
          PY

      - name: Save V2-E Acceptance Bundle
        uses: actions/upload-artifact@v4
        with:
          name: v2e-acceptance-bundle
          path: v2e-acceptance-bundle/**
          if-no-files-found: error
